name: Verify and deploy HesapTakip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automated tests
        run: npm test
      - name: Wrangler build check
        run: npx wrangler deploy --dry-run
      - name: Check Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare deployment blocked::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare deployment blocked::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # Deploying only static UI assets and their tests cannot change the D1
      # schema or server-side persistence. Any unknown/backend change fails
      # closed into the Time Travel verification below.
      - name: Classify UI-only release
        id: release_scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "ui_only=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Manual deployment requires database recovery verification."
            exit 0
          fi
          if [[ ! "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Unknown previous commit; database recovery verification is required."
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files; database recovery verification is required."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              public/*|tests/*|.github/workflows/deploy-cloudflare.yml) ;;
              *)
                echo "Change outside UI/test allowlist: $file"
                echo "Database recovery verification is required."
                exit 0
                ;;
            esac
          done
          echo "ui_only=true" >> "$GITHUB_OUTPUT"
          echo "Only public UI files, regression tests and this workflow changed."
          echo "No server, database, migration or Wrangler config changes in this release."
      # All backend/schema/config changes MUST verify a recoverable D1 state.
      # Read-only guard is never disabled for those changes.
      # A visual release still needs a recoverable D1 state. This is read-only.
      # Fail closed if the production DB is not on the Time Travel backend
      # or a bookmark cannot be retrieved for both now and two minutes ago.
      - name: Verify recoverable D1 state before deployment
        if: steps.release_scope.outputs.ui_only != 'true'
        env:
          # Read-only scope; do not broaden or replace the existing deploy token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Safe deployment blocked::Create a Cloudflare Account D1 Read token in GitHub Actions secret CLOUDFLARE_D1_READ_TOKEN."
            exit 1
          fi
          npx wrangler d1 info karttakip-db --json > "$RUNNER_TEMP/ht-d1-info.json"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ht-d1-info.json','utf8'));if(d.version!=='production'){console.error('D1 Time Travel is unsupported. Deployment blocked.');process.exit(1)};console.log('D1 production backend verified.');"
          npx wrangler d1 time-travel info karttakip-db --json > "$RUNNER_TEMP/ht-d1-current.json"
          npx wrangler d1 time-travel info karttakip-db --timestamp="$(date -u -d '2 minutes ago' +%s)" --json > "$RUNNER_TEMP/ht-d1-previous.json"
          node -e "const fs=require('fs');for(const n of ['current','previous']){const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ht-d1-'+n+'.json','utf8'));const key=data.bookmark||data.result?.bookmark;if(typeof key!=='string'||key.length<12){console.error('D1 recovery bookmark not verified. Deployment blocked.');process.exit(1)};if(n==='current')console.log('Pre-deployment D1 restore bookmark: '+key);else console.log('Historic D1 recovery point verified.')}"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
