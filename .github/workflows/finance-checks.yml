name: HesapTakip checks
on:
  push:
    branches:
      - feature/finance-suite-v3
      - feature/mobile-navigation-v4
      - feature/card-catalog-limits-v5
      - feature/overview-mealcard-dates-v6
      - feature/simplified-core-v7
      - feature/ios-fintech-design-v8
      - feature/daily-pos-ledger-v10
      - feature/bulk-bank-manager-six-meal-v11
      - feature/settings-brand-library-v12
      - feature/transaction-corrections-v13
      - feature/fix-inline-receivable-edit-v14
      - feature/simplify-cards-payouts-v9
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run
