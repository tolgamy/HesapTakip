name: Read-only production login diagnostics
on:
  pull_request:
    paths:
      - .github/workflows/login-diagnostics.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live health without login credentials or data changes
        shell: bash
        run: |
          set -euo pipefail
          base='https://hesaptakip.tolgamy.workers.dev'
          for path in / /version.json /api/session; do
            printf 'Checking %s ... ' "$path"
            status=$(curl -sS --max-time 15 --connect-timeout 8 -o /tmp/hesaptakip_body -w '%{http_code}' "$base$path") || {
              echo 'NETWORK_ERROR'
              exit 2
            }
            echo "HTTP $status"
            if [ "$path" = /api/session ]; then
              python3 - <<'PY'
          import json
          s=open('/tmp/hesaptakip_body',encoding='utf-8',errors='replace').read()
          try:
            obj=json.loads(s)
            print('session-response-keys:',sorted(obj) if isinstance(obj,dict) else type(obj).__name__)
            if isinstance(obj,dict) and 'error' in obj:
              print('public-error:',str(obj['error'])[:160])
          except Exception:
            print('session-response-not-json, bytes:',len(s))
          PY
            fi
          done
          # One deliberately invalid authentication request. No user password or real
          # account is used; this only distinguishes a login-path 500 from normal 401.
          printf 'Checking invalid admin login ... '
          status=$(curl -sS --max-time 15 --connect-timeout 8 -o /tmp/hesaptakip_body -w '%{http_code}' \
            -X POST -H 'Origin: https://hesaptakip.tolgamy.workers.dev' \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"DIAGNOSTIC_INVALID_PASSWORD_X1"}' \
            "$base/api/login")
          echo "HTTP $status"
          python3 - <<'PY'
          import json
          try:
            obj=json.load(open('/tmp/hesaptakip_body'))
            print('public-error:',str(obj.get('error','none'))[:200])
          except Exception: print('login-response-not-json')
          PY
          echo 'Public endpoints probed without real credentials or reading private records.'
